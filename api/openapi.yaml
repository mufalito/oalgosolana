openapi: 3.1.0
info:
  title: Solana Pay Gateway
  version: 1.0.0
  description: |
    Self-hosted, non-custodial Solana payment gateway. Funds move directly
    from customer to the merchant wallet configured server-side; this API
    holds zero private keys and exposes no fund-moving endpoints.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/payments:
    post:
      operationId: createPayment
      summary: Create a payment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentRequest' }
      responses:
        '200':
          description: Payment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentCreated' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '409': { $ref: '#/components/responses/Error409' }
        '429': { $ref: '#/components/responses/Error429' }
  /api/v1/payments/{id}:
    get:
      operationId: getPayment
      summary: Get payment status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentStatus' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }
  /api/v1/payments/{id}/webhook/replay:
    post:
      operationId: replayWebhook
      summary: Re-queue webhook delivery for a payment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Delivery requeued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [requeued] }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }
  /healthz:
    get:
      operationId: health
      summary: Liveness
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /readyz:
    get:
      operationId: ready
      summary: Readiness (DB + RPC)
      security: []
      responses:
        '200': { description: ready }
        '503': { description: dependency down }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error400:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Error401:
      description: Unauthorized
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Error404:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Error409:
      description: Duplicate order_id
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Error429:
      description: Rate limited
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [UNAUTHORIZED, RATE_LIMITED, NOT_FOUND, INVALID_AMOUNT, INVALID_CURRENCY,
                     INVALID_REQUEST, INVALID_WEBHOOK_URL, INVALID_EXPIRATION, DUPLICATE_ORDER_ID, INTERNAL]
            message: { type: string }
    CreatePaymentRequest:
      type: object
      required: [amount, currency, order_id]
      properties:
        amount:
          type: string
          description: Decimal string, e.g. "1.50"; max 9 (SOL) / 6 (USDC) fractional digits.
        currency:
          type: string
          enum: [SOL, USDC]
        order_id:
          type: string
          description: Merchant's own id; globally unique; duplicates return 409.
        label: { type: string }
        message: { type: string }
        webhook_url:
          type: string
          description: Optional per-payment override; https-only.
        expiration_minutes:
          type: integer
          description: Bounded by EXPIRATION_MINUTES_MIN/MAX config.
    PaymentCreated:
      type: object
      properties:
        payment_id: { type: string, format: uuid }
        order_id: { type: string }
        amount: { type: string }
        amount_base: { type: string }
        currency: { type: string, enum: [SOL, USDC] }
        solana_pay_url: { type: string }
        qr_code:
          type: string
          description: base64-encoded PNG QR of solana_pay_url
        reference: { type: string }
        deposit_address:
          type: string
          description: Present only in deposit-address mode - pay this address directly from any wallet (no Solana Pay support needed).
        status: { type: string, enum: [pending] }
        expires_at: { type: string, format: date-time }
    PaymentStatus:
      type: object
      properties:
        payment_id: { type: string, format: uuid }
        order_id: { type: string }
        amount: { type: string }
        amount_base: { type: string }
        currency: { type: string, enum: [SOL, USDC] }
        status:
          type: string
          enum: [pending, processing, confirmed, finalized, expired, failed]
        reference: { type: string }
        tx_signature: { type: string }
        detected_tx: { type: string }
        confirmed_at: { type: string, format: date-time }
        finalized_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        failure_reason:
          type: string
          enum: ['', WRONG_RECIPIENT, WRONG_MINT, WRONG_AMOUNT, MISSING_REFERENCE]
